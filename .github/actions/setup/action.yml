name: Setup
description: >-
  Install the pinned Bun, optionally a Node version, and the frozen workspace dependencies. Every
  job checks out the repository first, then calls this action, so the tool pins live in one place.

inputs:
  node-version:
    description: Node version to install. Leave empty to skip Node (the job runs on Bun alone).
    required: false
    default: ""
  registry-url:
    description: npm registry for `actions/setup-node`, used by the publish job.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.3.6"

    - name: Setup Node
      if: inputs.node-version != ''
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install
      shell: bash
      run: bun install --frozen-lockfile
