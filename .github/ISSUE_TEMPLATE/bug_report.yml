name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: input
    id: package
    attributes:
      label: Package
      description: Which package is affected? (e.g. `@plainworks/state`, `@plainworks/auth`)
      placeholder: "@plainworks/<name>"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: The installed version of the affected package.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime & versions
      description: Output of `node --version` and/or `bun --version`, plus TypeScript version.
      placeholder: "node v22.12.0 / bun 1.3.6 / typescript 6.0.3"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, and where the code runs (server / browser / both).
      placeholder: "macOS 15 / browser (Chrome 130) / Node server"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A minimal, self-contained snippet (or repo) that reproduces the issue.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / errors
      description: Console output, stack traces, or network logs.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and discussions and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through Security Advisories, not public issues).
          required: true
