name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: read-only by default; jobs opt into more only if they need it.
permissions:
  contents: read

# One in-flight run per ref; new pushes cancel the old run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # Every job is time-boxed, so a wedged step fails fast instead of holding the aggregate status
    # for the six-hour GitHub default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # N / N-1 LTS.
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      # The ordered gate list lives in `bun run verify` (`internal/verify`), so CI, the release
      # workflow, and local runs never disagree about what "green" means.
      - name: Verify (every Definition-of-Done gate)
        run: bun run verify

  # Proves the golden generator keeps producing gate-passing packages. Runs on a single
  # node (output is deterministic and the verify matrix already covers N/N-1); the tree it
  # mutates is the ephemeral runner checkout — nothing is committed.
  generator:
    name: generator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"

      - name: Generate server-only + client packages
        run: |
          bun run gen package --args smoke-server "CI smoke: server-only" false
          bun run gen package --args smoke-client "CI smoke: client entry" true
          bun install

      - name: Gates on generated packages
        run: bun run verify --filter=@plainworks/smoke-server --filter=@plainworks/smoke-client

      - name: Assert "use client" directive is preserved
        run: |
          test -f packages/smoke-client/dist/client.js
          head -n1 packages/smoke-client/dist/client.js | grep -qF '"use client"'
          ! grep -qF '"use client"' packages/smoke-client/dist/index.js

      # The hasClient:false branch: no client source, config, export, or built artifact may exist.
      - name: Assert server-only package has no client entry
        run: |
          test ! -e packages/smoke-server/src/client.ts
          test ! -e packages/smoke-server/tsconfig.client.json
          test ! -e packages/smoke-server/dist/client.js
          ! grep -qF '"./client"' packages/smoke-server/package.json

  # Boots BOTH reference hosts and probes them over HTTP — proving the published surfaces run under
  # two genuinely different hosts (Vite SSR + Next.js App Router / RSC), not just that they compile.
  # Single node: the verify matrix already covers N/N-1 typecheck/build/test; this proves runtime.
  hosts-smoke:
    name: hosts smoke (showcase + next)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"

      - name: Build the Next host and both hosts' package dependencies
        # The Next host needs a real production build for `next start`; the Vite showcase is served
        # by its dev server (middleware mode), so it only needs its workspace deps' dist, not its own
        # `vite build` output — hence the dependency-only `^...` filter for the showcase.
        run: bunx turbo run build --filter=@plainworks/showcase^... --filter=@plainworks/next-host

      - name: Boot the Vite showcase host and probe SSR
        run: |
          PORT=5173 bun run --filter @plainworks/showcase dev &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf --max-time 10 -o /dev/null "http://127.0.0.1:5173/" && ready=1 && break
            sleep 2
          done
          test "${ready:-}" = 1 || { echo "::error::showcase did not boot"; exit 1; }
          # The dashboard is session-gated. A POST to the login BFF begins the in-process mock-IdP
          # flow (login -> mock IdP -> /auth/callback -> /), so a broken PKCE/cookie handoff fails
          # here rather than passing on a redirect alone; the skip link is authenticated shell
          # chrome the signed-out login page never emits.
          jar="$(mktemp)"
          authenticated_html="$(
            curl -sfL --max-time 60 -c "$jar" -b "$jar" -d "returnTo=/" \
              "http://127.0.0.1:5173/login"
          )"
          grep -qF "Skip to main content" <<<"$authenticated_html"

      - name: Boot the Next.js host and probe its routes
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          APP_ORIGIN: "http://127.0.0.1:3000"
          AUTH_REDIRECT_ORIGIN: "http://127.0.0.1:3000"
        run: |
          (cd apps/next-host && bunx next start -p 3000) &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf --max-time 10 -o /dev/null "http://127.0.0.1:3000/" && ready=1 && break
            sleep 2
          done
          test "${ready:-}" = 1 || { echo "::error::next host did not boot"; exit 1; }
          # The public overview renders without a session.
          overview_html="$(curl -sf --max-time 30 "http://127.0.0.1:3000/")"
          grep -qF "Overview" <<<"$overview_html"
          # The mock backend serves the seeded task fixtures over real HTTP.
          tasks_json="$(
            curl -sf --max-time 30 "http://127.0.0.1:3000/api/tasks?limit=1"
          )"
          grep -qF '"data"' <<<"$tasks_json"
          # The gated route redirects an unauthenticated request to the login BFF.
          code="$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/tasks")"
          case "$code" in 302|307) ;; *) echo "::error::expected /tasks redirect, got $code"; exit 1 ;; esac
          # Follow the whole BFF chain with a cookie jar (/login -> mock IdP -> /auth/callback ->
          # /tasks), so a broken PKCE/cookie handoff fails here rather than passing on the redirect
          # alone. The unit tests drive the composition; this proves the route handlers.
          jar="$(mktemp)"
          authenticated_html="$(
            curl -sfL --max-time 60 -c "$jar" -b "$jar" \
              "http://127.0.0.1:3000/login?returnTo=/tasks"
          )"
          grep -qF "Tasks, highest priority first" <<<"$authenticated_html"

  # Proves the published `create-plainworks` initializer scaffolds an app that actually installs,
  # typechecks, and builds against the real (packed) `@plainworks/*` surfaces — the scaffolder's
  # equivalent of the generator smoke. The script packs every publishable package (resolving
  # `workspace:`/`catalog:` exactly as a release would), ejects the `next` example, redirects the
  # pinned deps to those local tarballs, and runs `install → typecheck → build → boot`. All in temp
  # dirs.
  create-smoke:
    name: create-plainworks smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"

      - name: Scaffold, install, typecheck, and build a generated app
        run: bun run --filter create-plainworks smoke

  # The browser gate: boots each reference host and runs its functional, axe, reflow, and
  # screenshot tests in real Chromium. It runs in the Playwright image pinned by digest, the same
  # one `internal/visual-baselines` writes the Linux baselines in, so fonts and rendering match them.
  # The showcase suite is sharded; every shard uploads a blob report that `browser-e2e-report`
  # merges into one HTML report per host.
  browser-e2e:
    name: browser e2e (${{ matrix.app }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: showcase, shard: 1/4 }
          - { app: showcase, shard: 2/4 }
          - { app: showcase, shard: 3/4 }
          - { app: showcase, shard: 4/4 }
          - { app: next-host, shard: 1/1 }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Playwright image ships without unzip, which setup-bun needs to unpack the Bun tarball.
      - name: Install unzip for setup-bun
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the host's package dependencies
        # Both hosts run their dev server, which serves the app from source, so they need only
        # their workspace dependencies' dist; hence the dependency-only `^...` filter.
        run: bunx turbo run build --filter=@plainworks/${{ matrix.app }}^...

      - name: Run the browser gate
        working-directory: apps/${{ matrix.app }}
        run: bunx playwright test --shard=${{ matrix.shard }}

      - name: Name the shard's artifacts
        if: always()
        id: artifact
        run: echo "suffix=$(echo '${{ matrix.shard }}' | tr / -)" >> "$GITHUB_OUTPUT"

      - name: Upload the blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-${{ matrix.app }}-${{ steps.artifact.outputs.suffix }}
          path: apps/${{ matrix.app }}/blob-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload traces and screenshot diffs
        # `retain-on-failure` keeps a failed test's trace, actual image, and diff under
        # `test-results/`, so a failure is diagnosable after the runner is gone.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: results-${{ matrix.app }}-${{ steps.artifact.outputs.suffix }}
          path: apps/${{ matrix.app }}/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Merges each host's shard blob reports into one HTML report, pass or fail.
  browser-e2e-report:
    name: browser e2e report (${{ matrix.app }})
    if: ${{ !cancelled() }}
    needs: [browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [showcase, next-host]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download the shard blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-${{ matrix.app }}-*
          path: apps/${{ matrix.app }}/all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        working-directory: apps/${{ matrix.app }}
        run: bunx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload the HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.app }}
          path: apps/${{ matrix.app }}/playwright-report/
          retention-days: 7

  # Single aggregate check for branch protection. The verify matrix and generator smoke
  # each surface their own contexts, but protection targets this one stable name so adding
  # or renaming a matrix leg never requires touching the branch rule.
  ci-status:
    name: CI Status
    if: always()
    timeout-minutes: 5
    needs: [verify, generator, hosts-smoke, create-smoke, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          results=("${{ needs.verify.result }}" "${{ needs.generator.result }}" "${{ needs.hosts-smoke.result }}" "${{ needs.create-smoke.result }}" "${{ needs.browser-e2e.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::CI failed — one or more jobs did not succeed."
              exit 1
            fi
          done
          echo "All CI checks passed ✓"
