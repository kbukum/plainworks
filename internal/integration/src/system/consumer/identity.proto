syntax = "proto3";

package gokit.auth.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

// Minimal mirror of the gokit auth-host Connect contract: WhoAmI maps an empty
// request to the authenticated principal string (for example "user:fixture-user").
service IdentityService {
  rpc WhoAmI(google.protobuf.Empty) returns (google.protobuf.StringValue);
}
