name: Release

# Publishes the @plainworks/* and create-plainworks packages to npm with build provenance (SLSA attestation).
#
# Provenance requires npm trusted publishing (OIDC) — an ambient CI identity, never a long-lived
# token. `bun publish` cannot emit provenance or use OIDC yet (oven-sh/bun#24855), and only Bun
# rewrites `catalog:` / `workspace:*` protocols, so this workflow uses the supported hybrid:
# `bun pm pack` resolves the protocols into a tarball, then `npm publish <tarball> --provenance`
# performs the attested publish. Trigger manually after the version-bump PR (see the `release`
# skill) has merged to `main`.
on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag (alpha while pre-stable; latest at 0.1.0)."
        type: string
        default: alpha

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (provenance)
    runs-on: ubuntu-latest
    # Release is main-only: a manual dispatch can select any ref, so guard the publish path to the
    # branch the `release` skill documents — a feature branch must never reach trusted publishing.
    # `release` is the protected environment where the maintainer gates and reviews the deployment.
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance attestation.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Provenance and OIDC trusted publishing require npm >= 11.5.1. Pin an exact, reviewed version
      # rather than `@latest`, so the release path can't pick up an unvetted npm at dispatch time.
      - name: Ensure npm supports provenance
        run: npm install --global npm@11.5.1

      # Re-prove every Definition-of-Done gate before publishing. A manual dispatch could target a
      # `main` commit that never passed CI, so the publish path runs `verify` itself instead of
      # trusting an earlier run. `verify` includes the release-line check, so a prerelease version
      # can never be published while Changesets pre mode is off.
      - name: Verify (every Definition-of-Done gate)
        run: bun run verify

      # Prove the derived publish set matches the publishable workspaces before touching the
      # registry, so a bug in the derivation fails the run instead of silently publishing the wrong
      # set. This is the guard against the fixed-list regression returning.
      - name: Verify publish set derivation
        run: bunx plainworks-release publish-set --check

      # Publish in dependency order derived from the workspace graph (`plainworks-release
      # publish-set`), never a hand-maintained list, so a new package is published with no workflow
      # edit. Each package is packed by `plainworks-release pack` (resolving `catalog:` /
      # `workspace:*` and applying `publishConfig`) then published by npm with provenance. Versions already on the registry are skipped so re-runs are idempotent,
      # and a prerelease version never goes out under the `latest` tag.
      - name: Publish with provenance
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if [[ "$version" == *-* && "$DIST_TAG" == "latest" ]]; then
              echo "::error::$name@$version is a prerelease; publish it under a prerelease tag."
              exit 1
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version — already published."
              continue
            fi
            echo "Publishing $name@$version…"
            tarball="$(bunx plainworks-release pack "$dir" | tail -n1)"
            npm publish "$tarball" --provenance --access public --tag "$DIST_TAG"
          done < <(bunx plainworks-release publish-set)
