name: Copilot Setup Steps

# Prepares the Copilot cloud agent's environment so it can run the same UI loop as a developer:
# `bun run ui:capture --affected` in `apps/showcase`. Runs on its own when this file changes, and by
# hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

concurrency:
  group: copilot-setup-steps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job must be named `copilot-setup-steps`, or the agent does not pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The agent overrides the checkout depth, so fetch `main` on its own: `ui:capture --affected`
      # and `--base main` need the merge-base with it.
      - name: Fetch main for the merge-base
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node-version: "24"

      - name: Install Chromium for the browser gate
        working-directory: apps/showcase
        run: bunx playwright install --with-deps chromium

      - name: Build the showcase's package dependencies
        # The showcase dev server serves the app from source, so it needs only its workspace
        # dependencies' dist.
        run: bunx turbo run build --filter=@plainworks/showcase^...
