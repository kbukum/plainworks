name: Release

# Publishes the @plainworks/* packages to npm with build provenance (SLSA attestation).
#
# Provenance requires npm trusted publishing (OIDC) — an ambient CI identity, never a long-lived
# token. `bun publish` cannot emit provenance or use OIDC yet (oven-sh/bun#24855), and only Bun
# rewrites `catalog:` / `workspace:*` protocols, so this workflow uses the supported hybrid:
# `bun pm pack` resolves the protocols into a tarball, then `npm publish <tarball> --provenance`
# performs the attested publish. Trigger manually after the version-bump PR (see the `release`
# skill) has merged to `main`.
on:
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag (alpha while pre-stable; latest at 0.1.0)."
        type: string
        default: alpha

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (provenance)
    runs-on: ubuntu-latest
    # Release is main-only: a manual dispatch can select any ref, so guard the publish path to the
    # branch the `release` skill documents — a feature branch must never reach trusted publishing.
    # `release` is the protected environment where the maintainer gates and reviews the deployment.
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance attestation.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.6"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: bun install --frozen-lockfile

      # Provenance and OIDC trusted publishing require npm >= 11.5.1. Pin an exact, reviewed version
      # rather than `@latest`, so the release path can't pick up an unvetted npm at dispatch time.
      - name: Ensure npm supports provenance
        run: npm install --global npm@11.5.1

      # Run the full Definition-of-Done gate sequence before publishing, in the order the `release`
      # skill documents. A manual dispatch could target a `main` commit that never passed CI, so the
      # publish path re-proves every gate itself rather than trusting an earlier run.
      - name: Check versions
        run: bun run check-versions

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Check boundaries
        run: bun run check-boundaries

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Verify packaging before publish
        run: bun run check-packaging

      # Publish lowest layer first (dependency order): std → testkit/http/mocks → state. Each
      # package is packed by Bun (resolving `catalog:` / `workspace:*`) then published by npm with
      # provenance. Versions already on the registry are skipped so re-runs are idempotent.
      - name: Publish with provenance
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: |
          set -euo pipefail
          for pkg in std testkit http mocks state; do
            dir="packages/$pkg"
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version — already published."
              continue
            fi
            echo "Publishing $name@$version…"
            tarball="$(cd "$dir" && bun pm pack --quiet | tail -n1)"
            npm publish "$dir/$tarball" --provenance --access public --tag "$DIST_TAG"
          done
